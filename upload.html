<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THIMO Image Upload</title>
<style>
  :root { --green:#006B45; --green-dark:#003D2B; --gold:#FFC400; --red:#E92323; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #F4FAF6; color: #0C2119;
  }
  .card {
    width: 100%; max-width: 460px; background: #fff; border-radius: 20px;
    padding: 28px; box-shadow: 0 10px 30px -12px rgba(0,61,43,.25);
  }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--green-dark); }
  p.hint { margin: 0 0 20px; font-size: 14px; color: #4D6459; }
  input[type=file] {
    width: 100%; padding: 12px; border: 2px dashed rgba(0,107,69,.35);
    border-radius: 12px; background: #F4FAF6; font-size: 14px;
  }
  button {
    margin-top: 14px; width: 100%; height: 48px; border: 0; border-radius: 999px;
    background: var(--gold); color: var(--green-dark); font-weight: 700; font-size: 16px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  #preview { display: none; width: 100%; max-height: 220px; object-fit: contain; margin-top: 14px; border-radius: 12px; }
  #status { margin: 16px 0 0; font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
  <main class="card">
    <h1>Upload image</h1>
    <p class="hint">JPG, PNG or WEBP.</p>

    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
    <img id="preview" alt="Selected image preview">
    <button id="uploadBtn">Upload image</button>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    function setStatus(text, color) {
      status.textContent = text;
      status.style.color = color;
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) { preview.style.display = 'none'; return; }
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { setStatus('Choose an image first.', '#B45309'); return; }

      uploadBtn.disabled = true;
      setStatus('Uploading…', '#006B45');

      try {
        const blob = await upload(file.name, file, {
          access: 'public',
          handleUploadUrl: '/api/upload',
        });
        status.style.color = '#006B45';
        status.innerHTML = 'Uploaded: <a target="_blank" rel="noopener"></a>';
        const a = status.querySelector('a');
        a.href = blob.url;
        a.textContent = blob.url;
      } catch (err) {
        console.error(err);
        setStatus('Upload failed: ' + err.message, '#E92323');
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
